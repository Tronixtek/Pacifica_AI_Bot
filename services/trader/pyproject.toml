[project]
name = "vtfx-mt5-trader"
version = "0.1.0"
description = "VTFX MT5 price action trading engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "MetaTrader5>=5.0.45; sys_platform == 'win32'",
  "numpy>=1.26.0",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "requests>=2.31.0",
  "uvicorn[standard]>=0.30.6"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
