services:
  - type: web
    runtime: node
    name: vtfx-mt5-bot-web
    region: frankfurt
    rootDir: .
    buildCommand: npm install && npm run build:web
    startCommand: npm --workspace @vtfx-mt5-bot/web run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    buildFilter:
      paths:
        - apps/web/**
        - packages/shared/**
        - package.json
        - package-lock.json
        - tsconfig.base.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: 22.0.0
      - key: NEXT_PUBLIC_TRADER_API_URL
        value: https://vtfx-mt5-bot-trader.onrender.com

  - type: web
    runtime: python
    name: vtfx-mt5-bot-trader
    region: frankfurt
    rootDir: services/trader
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /readyz
    disk:
      name: vtfx-mt5-bot-trader-data
      mountPath: /var/data/vtfx-mt5-trader
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://vtfx-mt5-bot-web.onrender.com
      - key: BOT_MODE
        value: paper
      - key: USE_SIMULATED_FEED
        value: "true"
      - key: ENABLE_LIVE_TRADING
        value: "false"
      - key: PERSIST_RUNTIME_STATE
        value: "true"
      - key: AUDIT_LOG_PATH
        value: /var/data/vtfx-mt5-trader/logs/audit.jsonl
      - key: STATE_STORE_PATH
        value: /var/data/vtfx-mt5-trader/state/runtime.sqlite3
      - key: ML_DATASET_ROOT
        value: /var/data/vtfx-mt5-trader/training
      - key: ML_MODEL_ARTIFACT_PATH
        value: /var/data/vtfx-mt5-trader/models/ml_signal_model.json
